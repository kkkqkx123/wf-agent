[package]
name = "tui-render"
version.workspace = true
edition.workspace = true
description = "Low-level TUI implementation crate (tui-render)"

[dependencies]
ratatui = { workspace = true }
tui-core = { path = "../tui-core" }
tui-style = { path = "../tui-style" }
tui-components = { path = "../tui-components" }

[features]
default = []

[dev-dependencies]
wf-common = { workspace = true }
wf-types = { workspace = true }
wf-api = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
wf-cli-shared = { path = "../../cli/wf-cli-shared" }
wf-llm = { path = "../../../infra/wf-llm", features = ["mock"] }
