# Tool-specific Configuration
#
# Overrides the hardcoded defaults in each tool's dedicated processor.
# Values set here are passed to the corresponding transform function
# and merged with SDK-internal defaults.
#
# When a field is omitted, the processor's hardcoded default is used.
# This file exists so that deployers can override tool behaviour
# without modifying source code.

[read_file]
# max_file_size = 500000               # 500KB (processor default)
# max_chars = 200000                    # 200K chars (processor default)
# max_lines = 2000                      # 2000 lines (processor default)
# enable_ignore = false
# enable_protect = false
# model_id = null

[glob]
# workspace_dir = "./"
# max_results = 50                      # processor default
# enable_ignore = true

[list_files]
# workspace_dir = "./"
# max_results = 1000                    # processor default
# enable_ignore = true

# Host-level shell defaults. These override the sandbox profile lists
# (`sandbox.toml [profiles.policy.shell]`) for every shell spawn through
# `CommandPolicy::effect_lists` (ShellToolConfig > profile > built-in).
# Omit a key to inherit; an explicit empty list disables that fallback side.
[shell]
# workspace_dir = "./"
# max_timeout_ms = 120000
# allowed_commands = ["git", "ls", "cat"]
# denied_commands = ["sudo", "su"]
# read_commands = ["ls", "cat", "git"]
# write_commands = ["cargo", "npm", "python3"]
# Code-context service (CCE server) backing the fold stage of context
# compression and the code_search / code_keyword_search / code_symbols /
# code_references / code_definition / read_file_folded tools.
# Omit the whole section (or set enabled = false) to leave the service off.
[code_context]
# enabled = false
# transport_mode = "external"            # external | managed
# base_url = "http://127.0.0.1:9000"     # required when enabled with external transport
# timeout_ms = 60000                     # per-call timeout
# managed_binary = "cce-server"          # PATH lookup when relative
# managed_port = 0                       # 0 picks an ephemeral loopback port
# managed_startup_timeout_ms = 15000
# managed_max_restarts = 3               # restarts after unexpected exits
# managed_log_level = "info"             # passed to the child process environment
# auth_token_env = "CCE_TOKEN"           # env var name holding the bearer token
# fold_min_tokens = 800
# fold_max_tokens = 2000
# fold_max_items = 32
# fold_max_retries = 2
# fold_total_budget_ms = 60000           # whole fold stage; exhaustion skips folding
# supply_mode = "managed"                # managed | external (derived from transport_mode)
# managed_watch = true                   # managed supply keeps the index fresh
# watch_timeout_ms = 10000
# default_project_id = 1                 # explicit override, not the source of truth
# default_limit = 10
# max_results = 100
