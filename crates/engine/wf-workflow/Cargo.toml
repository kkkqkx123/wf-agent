wf-execution-shared = { path = "../wf-execution-shared" }
wf-config = { path = "../../infra/wf-config" }
wf-metrics = { path = "../../infra/wf-metrics" }
wf-agent = { path = "../wf-agent" }
wf-sandbox = { path = "../../infra/wf-sandbox" }
wf-script = { path = "../../infra/wf-script" }
wf-shell = { path = "../../infra/wf-shell" }
wf-storage = { path = "../../infra/wf-storage" }
wf-resource = { path = "../wf-resource" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
