[package]
name = "wf-cli-demo"
version.workspace = true
edition.workspace = true
description = "Demo examples for wf-agent CLI implementations (headless, mini, full TUI)"

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
wf-tui = { path = "../wf-tui" }
wf-types = { workspace = true }
serde_json.workspace = true
wf-cli-shared = { path = "../wf-cli-shared" }

[features]
default = []
diff-record = ["wf-tui/diff-record"]

[[example]]
name = "tui_animation"
path = "examples/tui/animation.rs"

