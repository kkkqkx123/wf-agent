# Server-owned backend registry and scheduled backups.
#
# Schema: wf_server::backends::BackendConfig.
# Priority (high to low): environment > project `.wf/server/backends.toml` >
# settings-dir `server/backends.toml` > built-in defaults.
# A present but invalid file fails startup; secrets stay in the environment.

enabled = false
probe_interval_secs = 30
probe_timeout_secs = 5
default_local_port = 18080

# Backup bundles and the SQLite index (`backends.db`) live here.
# Empty value disables scheduled backups.
backup_dir = ""

# Remote sync requests send this directory as `x-wf-directory`. A registry
# entry can override it with `backup_directory`.
backup_directory = ""

registry_path = ""
backup_interval_secs = 3600
backup_retention_count = 10
backup_retention_days = 7

# Remote fetch budget. Checkpoints are never truncated; an oversized bundle
# fails before it reaches the backup directory.
backup_timeout_secs = 15
backup_max_response_bytes = 67108864

# Interval of the periodic full remote re-check in seconds. Revision polling
# only compares recorded digests, so this pass is what finds silent damage.
# Zero keeps the startup pass and disables the recurring one.
backup_reconcile_interval_secs = 21600

# Remote deployment. The install root is relative to the remote login home:
# binaries land under `bin/<version>` with a `current` symlink, transferred
# configuration under `server/` and scripts under `scripts/`. Nothing needs
# root and no system service is created, so no autostart either.
deploy_install_root = ".wf-server"
# Release download base. The remote host fetches
# `<base>/wf-agent-server-<version>-<platform>.tar.gz` for its own OS/arch,
# the same naming contract as deploy/scripts/fetch-package.sh. Empty means
# a local/url/remote_path artifact must be passed explicitly.
deploy_artifact_base_url = "https://packages.example.com/wf-agent"
# Local deploy source root. `--from` selects a directory inside it; scope
# `config` transfers server/*.toml, `full` also transfers scripts/*.
deploy_source_root = "deploy"
# Bound on one remote command, and how long `start` waits for the loopback
# health endpoint before it reports failure.
deploy_exec_timeout_secs = 120
deploy_start_timeout_secs = 30
# Terminal deployment job records: age limit in days and per-backend cap.
# Queued and running jobs are never pruned.
deploy_job_retention_days = 30
deploy_job_max_per_backend = 200
# Grace before supervised SSH forwards are killed on shutdown, letting
# in-flight backup fetches finish. 0 kills immediately; max 30.
tunnel_stop_grace_secs = 2

# Environment overrides:
# WF_BACKEND_ENABLED, WF_BACKEND_PROBE_INTERVAL_SECS,
# WF_BACKEND_PROBE_TIMEOUT_SECS, WF_BACKEND_DEFAULT_LOCAL_PORT,
# WF_BACKEND_BACKUP_DIR, WF_BACKEND_BACKUP_DIRECTORY,
# WF_BACKEND_REMOTE_API_KEY, WF_BACKEND_REGISTRY_PATH,
# WF_BACKEND_BACKUP_INTERVAL_SECS, WF_BACKEND_BACKUP_TIMEOUT_SECS,
# WF_BACKEND_BACKUP_MAX_RESPONSE_BYTES,
# WF_BACKEND_BACKUP_RECONCILE_INTERVAL_SECS,
# WF_BACKEND_DEPLOY_INSTALL_ROOT, WF_BACKEND_DEPLOY_ARTIFACT_BASE_URL,
# WF_BACKEND_DEPLOY_SOURCE_ROOT, WF_BACKEND_DEPLOY_EXEC_TIMEOUT_SECS,
# WF_BACKEND_DEPLOY_START_TIMEOUT_SECS, WF_BACKEND_DEPLOY_JOB_RETENTION_DAYS,
# WF_BACKEND_DEPLOY_JOB_MAX_PER_BACKEND, WF_BACKEND_TUNNEL_STOP_GRACE_SECS.
# WF_BACKEND_REMOTE_API_KEY is never read from this file.
