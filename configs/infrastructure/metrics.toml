# Metrics Configuration
#
# Controls the metrics collection system across the SDK.
# Each collector can be independently configured for buffer size and flush interval.
#
# Processor: infrastructure → merge_metrics_with_defaults()

# Global settings
enabled = true
enable_periodic_reporting = false
reporting_interval = 60000

# --- Individual collectors ---

[workflow_metrics]
buffer_size = 100
flush_interval = 5000
enable_periodic_reporting = false

[node_metrics]
buffer_size = 100
flush_interval = 5000

[agent_metrics]
