[package]
name = "wf-cli"
version.workspace = true
edition.workspace = true
description = "wf-agent command line interface: headless run, mini and full TUI modes"

[dependencies]
clap.workspace = true
async-trait.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
futures.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
wf-common = { path = "../wf-common" }
wf-types = { path = "../wf-types" }
wf-core = { path = "../wf-core" }
wf-runtime = { path = "../wf-runtime" }
wf-api = { path = "../wf-api" }
wf-agent = { path = "../wf-agent" }
wf-config = { path = "../wf-config" }
wf-llm = { path = "../wf-llm" }
wf-tools = { path = "../wf-tools" }

[dev-dependencies]
tempfile = "3"
wf-llm = { path = "../wf-llm", features = ["mock"] }

[[bin]]
name = "wf"
path = "src/main.rs"
