# LLM Profile: Gemini 2.5 Flash (OpenAI Compatible)
#
# Schema:  wf_types::llm::profile::LlmProfile
# Provider: LlmProvider::GEMINI_OPENAI
#
# Uses the Gemini OpenAI-compatible endpoint (v1beta/openai).

id = "gemini-2.5-flash-openai"
name = "Gemini 2.5 Flash (OpenAI Compatible)"
provider = "GEMINI_OPENAI"
model = "gemini-2.5-flash"
apiKey = "${GEMINI_API_KEY}"
baseUrl = "https://generativelanguage.googleapis.com/v1beta/openai"
authType = "bearer"
contextWindowSize = 1048576

timeout = 30000
maxRetries = 2
retryDelay = 1000

[parameters]
temperature = 0.5
maxTokens = 8192

[metadata]
tags = ["gemini", "gemini-flash", "openai-compatible", "fast"]