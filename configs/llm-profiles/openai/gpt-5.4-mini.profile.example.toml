# GPT-5.4-mini — Fast
#
# Use for high-volume, low-complexity tasks: classification, extraction,
# simple Q&A, or as a cost-effective fallback model.
#
# GPT-5.4 supports reasoning effort none/low/medium/high/xhigh over Chat
# Completions (top-level reasoning_effort) plus verbosity low/medium/high.
# Do NOT set temperature/top_p together with thinking: reasoning models
# ignore them (a warning is logged).

id = "gpt-5.4-mini"
name = "GPT-5.4-mini"
provider = "OPENAI_CHAT"
model = "gpt-5.4-mini"
apiKey = "${OPENAI_API_KEY}"
baseUrl = "https://api.openai.com/v1"
timeout = 30000
maxRetries = 2
retryDelay = 5000

[generation]
max_tokens = 12800
verbosity = "medium"

[generation.thinking]
level = "medium"

[metadata]
tags = ["openai", "gpt-4o-mini", "fast", "cheap"]
