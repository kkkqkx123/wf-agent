[package]
name = "wf-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs", "process", "io-util"] }
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
regex = "1.10"
serde_json = "1"
shlex = "2.0"
blake3.workspace = true

wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }

# mlua send feature is not required for sandbox; kept without send for minimal
# dependency. When built together with wf-plugin (which enables send), workspace
# feature unification will enable send implicitly. This is intentional and
# documented; future decoupling of mlua dependencies may be considered.
mlua = { version = "0.9", optional = true, default-features = false, features = ["luajit"] }
libc = "0.2"

[features]
default = []
lua = ["dep:mlua"]
