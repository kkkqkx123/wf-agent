[package]
name = "wf-mini"
version.workspace = true
edition.workspace = true
description = "wf-agent lightweight native-terminal interactive agent (line discipline, append-only output)"

[dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
futures.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
wf-common = { path = "../../../foundation/wf-common" }
wf-types = { path = "../../../foundation/wf-types" }
wf-client = { path = "../../wf-client" }
wf-cli-shared = { path = "../wf-cli-shared" }
# Low-level TUI implementation crates can be referenced by the lightweight
# frontends too (e.g. terminal backend + clock), keeping `cli/` lean.
tui-terminal = { path = "../../tui/tui-terminal" }
tui-clock = { path = "../../tui/tui-clock" }
# Raw-mode prompt editor: termios + render commands, key/width tables.
crossterm.workspace = true
libc.workspace = true
unicode-width.workspace = true

[[bin]]
name = "wf-mini"
path = "src/main.rs"
