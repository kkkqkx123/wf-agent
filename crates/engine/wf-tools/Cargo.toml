[package]
name = "wf-tools"
version.workspace = true
edition.workspace = true

[dependencies]
wf-core = { path = "../../foundation/wf-core" }
wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }
wf-sandbox = { path = "../../infra/wf-sandbox" }
wf-shell = { path = "../../infra/wf-shell" }

async-trait.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
dashmap.workspace = true
futures.workspace = true
regex.workspace = true
globset.workspace = true
layertwine = { path = "../../vendor/layertwine", features = ["grpc"], optional = true }
tonic = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite"]
# SQLite-backed session-note storage (default dbPath `<workspace>/data/session-notes.db`).
# Without this feature session notes fall back to an in-memory store.
sqlite = ["dep:rusqlite"]
# Layertwine gRPC remote executor (embedded + remote deployment modes).
remote-layertwine = ["dep:layertwine", "dep:tonic"]
lua = ["wf-sandbox/lua"]

[dev-dependencies]
tempfile = "3"
