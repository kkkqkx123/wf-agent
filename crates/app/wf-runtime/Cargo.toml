[package]
name = "wf-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dashmap.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
wf-integration = { path = "../../infra/wf-integration" }
wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }
wf-storage = { path = "../../infra/wf-storage" }
wf-core = { path = "../../foundation/wf-core" }
wf-metrics = { path = "../../infra/wf-metrics" }
wf-resource = { path = "../../engine/wf-resource" }
wf-config = { path = "../../infra/wf-config" }
wf-llm = { path = "../../infra/wf-llm" }
wf-pricing = { path = "../../infra/wf-pricing" }
wf-llm-catalog = { path = "../../infra/wf-llm-catalog" }
wf-checkpoint = { path = "../../infra/checkpoint/wf-checkpoint" }
wf-plugin = { path = "../../infra/wf-plugin", optional = true, default-features = false }
wf-agent = { path = "../../engine/wf-agent" }
wf-workflow = { path = "../../engine/wf-workflow" }
wf-execution-shared = { path = "../../engine/wf-execution-shared" }
wf-tools = { path = "../../engine/wf-tools" }
wf-shell = { path = "../../infra/wf-shell" }
wf-sandbox = { path = "../../infra/wf-sandbox" }
wf-api = { path = "../wf-api" }

[dev-dependencies]
wf-llm = { path = "../../infra/wf-llm", features = ["mock"] }
tempfile.workspace = true

[features]
# Product default: the plugin engine plus all three backends. `plugins`
# alone yields an engine with no loadable backend; name the backends to
# keep.
# `lua`/`native`/`wasm` each imply `plugins`: they forward
# `wf-plugin/<backend>`, which enables the optional dependency.
# `native` is compiled in by default but stays disabled at runtime.
default = ["plugins", "lua", "native", "wasm"]
plugins = ["dep:wf-plugin"]
lua = ["wf-sandbox/lua", "wf-plugin/lua"]
native = ["wf-plugin/native"]
wasm = ["wf-plugin/wasm"]
