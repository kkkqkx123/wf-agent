[package]
name = "wf-cli"
version.workspace = true
edition.workspace = true
description = "wf-agent command line interface: headless run, mini and full TUI modes"

[dependencies]
clap.workspace = true
async-trait.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
futures.workspace = true
libc.workspace = true
regex.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
tokio-util.workspace = true
wf-common = { path = "../../foundation/wf-common" }
wf-types = { path = "../../foundation/wf-types" }
wf-core = { path = "../../foundation/wf-core" }
wf-api = { path = "../wf-api" }
wf-runtime = { path = "../wf-runtime", optional = true }

[dev-dependencies]
tempfile = "3"
wf-llm = { path = "../../infra/wf-llm", features = ["mock"] }
wf-storage = { path = "../../infra/wf-storage" }
wf-resource = { path = "../../infra/wf-resource" }

[features]
default = ["embedded"]
embedded = ["dep:wf-runtime"]
remote = ["reqwest/json", "reqwest/stream"]

[[bin]]
name = "wf"
path = "src/main.rs"
