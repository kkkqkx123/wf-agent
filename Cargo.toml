[workspace]
resolver = "2"
members = [
    "crates/wf-types",
    "crates/wf-common",
    "crates/wf-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["v4", "v5", "v7", "serde"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
tracing = "0.1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono"] }
