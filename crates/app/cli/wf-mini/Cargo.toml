[package]
name = "wf-mini"
version.workspace = true
edition.workspace = true
description = "wf-agent lightweight native-terminal interactive agent (line discipline, append-only output)"

[dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "time"] }
futures.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
wf-common = { path = "../../../foundation/wf-common" }
wf-types = { path = "../../../foundation/wf-types" }
wf-client = { path = "../../wf-client" }
wf-cli-shared = { path = "../wf-cli-shared" }
# Shared plain-text markdown renderer (render_plain_text).
tui-markdown = { path = "../../tui/tui-markdown" }
# Raw-mode prompt editor: crossterm events, styles and terminal control.
crossterm.workspace = true
# Window title heartbeat helpers (sanitize_title / running_title).
tui-terminal = { path = "../../tui/tui-terminal" }
libc.workspace = true
unicode-width.workspace = true
regex.workspace = true

[[bin]]
name = "wf-mini"
path = "src/main.rs"
