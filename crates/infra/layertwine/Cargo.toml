[package]
name = "layertwine"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v5"] }
similar = { workspace = true }
parking_lot = { workspace = true }
lazy_static = "1.5"
rand = { workspace = true }
zstd = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
lazy_static = "1.5"

[[test]]
name = "engine_integration"
path = "tests/engine_integration.rs"

[[test]]
name = "engine_test"
path = "tests/engine_test.rs"

[[test]]
name = "layered_integration"
path = "tests/layered_integration.rs"

[[test]]
name = "storage_integration"
path = "tests/storage_integration.rs"

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "merge"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "engine_edge"
harness = false

[[bench]]
name = "file_storage"
harness = false
