# LLM Profile: OpenAI o1 (Reasoning)
#
# Schema:  wf_types::llm::profile::LlmProfile
# Provider: LlmProvider::OPENAI_RESPONSE
#
# The o1 model uses the OpenAI Responses API (not Chat Completions).
# o1 supports reasoning effort low/medium/high (no minimal/none/xhigh/max).

id = "o1"
name = "OpenAI o1"
provider = "OPENAI_RESPONSE"
model = "o1"
apiKey = "${OPENAI_API_KEY}"
baseUrl = "https://api.openai.com/v1"
authType = "native"
contextWindowSize = 200000

timeout = 300000
maxRetries = 3
retryDelay = 15000

[generation]
max_tokens = 32768

[generation.thinking]
level = "high"

[metadata]
tags = ["openai", "o1", "reasoning", "deep", "complex"]
