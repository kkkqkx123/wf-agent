[package]
name = "wf-agent"
version.workspace = true
edition.workspace = true

[dependencies]
wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }
wf-core = { path = "../../foundation/wf-core" }
wf-tools = { path = "../wf-tools" }
wf-llm = { path = "../../infra/wf-llm" }
wf-checkpoint = { path = "../wf-checkpoint" }
wf-storage = { path = "../../infra/wf-storage" }
wf-execution-shared = { path = "../wf-execution-shared" }
wf-metrics = { path = "../../infra/wf-metrics" }
wf-sandbox = { path = "../../infra/wf-sandbox", optional = true }
wf-plugin = { path = "../../infra/wf-plugin", optional = true }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
dashmap.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
futures.workspace = true

[features]
lua = ["wf-plugin/lua", "wf-sandbox/lua"]
native = ["wf-plugin/native"]

[dev-dependencies]
wf-llm = { path = "../../infra/wf-llm", features = ["mock"] }
