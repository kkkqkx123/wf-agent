[package]
name = "wf-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
http.workspace = true
futures.workspace = true
clap.workspace = true
wf-config = { path = "../../infra/wf-config" }
wf-metrics = { path = "../../infra/wf-metrics" }
wf-common = { path = "../../foundation/wf-common" }
wf-api = { path = "../wf-api" }
wf-types = { path = "../../foundation/wf-types", features = ["utoipa"] }
wf-runtime = { path = "../wf-runtime", default-features = false }
tower.workspace = true
tower-http.workspace = true
percent-encoding.workspace = true
dashmap.workspace = true
utoipa.workspace = true
base64.workspace = true
sha2.workspace = true
blake3.workspace = true
hex.workspace = true
reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio-util.workspace = true

[features]
# Product default: the plugin subsystem plus all three backends. The
# runtime default features are off so that trimming here actually
# removes a backend instead of being re-added downstream.
# `lua`/`native`/`wasm` each imply `plugins` through the runtime.
# `native` is compiled in by default but stays disabled at runtime.
default = [
    "plugins", "lua", "native", "wasm",
    "file-checkpoint", "keyword", "rag-vector", "pty", "mcp", "git-fs",
    "backends", "metrics", "storage-sqlite", "storage-postgres",
]
plugins = ["wf-runtime/plugins"]
lua = ["wf-runtime/lua"]
native = ["wf-runtime/native"]
wasm = ["wf-runtime/wasm"]
file-checkpoint = ["wf-runtime/file-checkpoint"]
keyword = ["wf-runtime/keyword"]
rag-vector = ["wf-runtime/rag-vector"]
pty = ["wf-api/pty"]
mcp = ["wf-runtime/mcp"]
git-fs = []
backends = ["dep:reqwest", "dep:sqlx", "sqlx/sqlite"]
metrics = ["wf-runtime/metrics"]
storage-sqlite = ["wf-runtime/storage-sqlite"]
storage-postgres = ["wf-runtime/storage-postgres"]
openapi-docs = []
# Dedicated remote execution node: every domain that needs the remote
# workspace or its runtime, without the local-only management and UI
# surfaces. Incompatible with `backends`, which belongs to the local side.
remote-node = [
    "plugins", "lua", "wasm",
    "file-checkpoint", "keyword", "rag-vector", "pty", "mcp", "git-fs",
    "storage-sqlite",
]

[[bin]]
name = "wf-server"
path = "src/main.rs"

[dev-dependencies]
tower = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite.workspace = true
async-trait.workspace = true
vector-contracts = { path = "../../infra/vector-contracts" }
rag-core = { path = "../../infra/rag-core" }
llm-embedding = { package = "llm-suite-embedding", path = "../../infra/llm-suite/crates/llm-suite-embedding" }
wf-common = { path = "../../foundation/wf-common" }
wf-core = { path = "../../foundation/wf-core" }
wf-resource = { path = "../../engine/wf-resource" }
wf-storage = { path = "../../infra/wf-storage" }
wf-workflow = { path = "../../engine/wf-workflow" }
