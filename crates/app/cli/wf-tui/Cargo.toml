[package]
name = "wf-tui"
version.workspace = true
edition.workspace = true
description = "wf-agent full TUI implementation (ratatui): interactive agent forms and widgets"

[dependencies]
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
futures.workspace = true
libc.workspace = true
regex.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
wf-common = { path = "../../../foundation/wf-common" }
wf-types = { path = "../../../foundation/wf-types" }
wf-client = { path = "../../wf-client" }
wf-cli-shared = { path = "../wf-cli-shared" }
wf-config = { path = "../../../infra/wf-config" }
# Low-level TUI implementation crates (crates/app/tui/). The `wf-tui` facade
# depends on them; `wf-mini` may also depend on them directly.
tui-clock = { path = "../../tui/tui-clock" }
tui-terminal = { path = "../../tui/tui-terminal" }
tui-style = { path = "../../tui/tui-style" }
tui-markdown = { path = "../../tui/tui-markdown" }
tui-core = { path = "../../tui/tui-core" }
tui-components = { path = "../../tui/tui-components" }
tui-render = { path = "../../tui/tui-render" }
tui-debug = { path = "../../tui/tui-debug" }

[features]
default = []
diff-record = ["tui-core/diff-record", "tui-debug/diff-record"]

[dev-dependencies]
axum.workspace = true
insta.workspace = true

[[bin]]
name = "wf"
path = "src/main.rs"
