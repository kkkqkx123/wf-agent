[package]
name = "wasm-echo"
version = "1.0.0"
edition = "2021"

# Detached from the parent workspace: this crate builds for a wasm target
# with its own profile and must never inherit workspace members.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
