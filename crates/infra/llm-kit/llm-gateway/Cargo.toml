[package]
name = "llm-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Mock-client routing for tests; forwards to llm-client's mock feature.
mock = ["llm-client/mock"]

[dependencies]
llm-client = { path = "../llm-client" }
llm-codec = { path = "../llm-codec" }
llm-config = { path = "../llm-config" }
llm-message = { path = "../llm-message" }
llm-types = { path = "../llm-types" }
dashmap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
llm-client = { path = "../llm-client", features = ["mock"] }
