[workspace]
resolver = "2"
members = [
    "llm-common",
    "llm-types",
    "llm-embedding",
    "llm-chat-basic",
    "llm-rerank",
    "llm-tool-call",
    "llm-token",
    "llm-message",
    "llm-codec",
    "llm-client",
    "llm-config",
    "llm-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
dashmap = "6"
async-trait = "0.1"
# Kept in lockstep with the host workspace so both resolve one reqwest line.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
eventsource-stream = "0.2"
futures = "0.3"
tokio-util = "0.7"
bytes = "1"
url = { version = "2", features = ["serde"] }
regex = "1"
