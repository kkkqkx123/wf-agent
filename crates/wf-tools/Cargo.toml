[package]
name = "wf-tools"
version.workspace = true
edition.workspace = true

[dependencies]
wf-types = { path = "../wf-types" }
wf-common = { path = "../wf-common" }

async-trait.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
once_cell.workspace = true
eventsource-stream.workspace = true
dashmap.workspace = true
futures.workspace = true
regex.workspace = true
globset.workspace = true
layertwine = { path = "../layertwine", features = ["grpc"], optional = true }
tonic = { workspace = true, optional = true }

[features]
default = []
# Layertwine gRPC remote executor (embedded + remote deployment modes).
remote-layertwine = ["dep:layertwine", "dep:tonic"]

[dev-dependencies]
tempfile = "3"
