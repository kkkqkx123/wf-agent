[package]
name = "wf-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dashmap.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
wf-types = { path = "../wf-types" }
wf-common = { path = "../wf-common" }
wf-storage = { path = "../wf-storage" }
wf-core = { path = "../wf-core" }
wf-metrics = { path = "../wf-metrics" }
wf-resource = { path = "../wf-resource" }
wf-config = { path = "../wf-config" }
wf-llm = { path = "../wf-llm" }
wf-checkpoint = { path = "../wf-checkpoint", optional = true }
wf-plugin = { path = "../wf-plugin", optional = true }
wf-server = { path = "../wf-server" }
wf-agent = { path = "../wf-agent" }
wf-workflow = { path = "../wf-workflow" }
wf-execution-shared = { path = "../wf-execution-shared" }
wf-tools = { path = "../wf-tools" }
wf-shell = { path = "../wf-shell" }
wf-sandbox = { path = "../wf-sandbox" }
wf-api = { path = "../wf-api" }

[dev-dependencies]
wf-llm = { path = "../wf-llm", features = ["mock"] }
tempfile = "3"

[features]
default = ["sqlite", "postgres"]
sqlite = ["wf-storage/sqlite", "wf-api/sqlite"]
postgres = ["wf-storage/postgres"]
checkpoint = ["wf-checkpoint"]
plugins = ["wf-plugin"]
