[package]
name = "example-llm-auth-claude-subscription"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Sample wf-agent native plugin: Claude Pro/Max subscription login (OAuth 2.0 PKCE paste flow). Contract teaching sample, not a product runtime dependency."

# Standalone workspace: the plugin ships as an independently buildable
# cdylib and must not join the wf-agent workspace (its dependency set is
# deliberately different from the host's).
[workspace]

[lib]
name = "example_llm_auth_claude_subscription"
crate-type = ["cdylib"]

[dependencies]
wf-plugin-sdk = { path = "../../../crates/foundation/wf-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "form"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"

[dev-dependencies]
# Keeps the embedded manifest snapshot (`wf-plugin.toml`) in sync with the
# typed `manifest()` the cdylib exports over the C ABI.
toml = "1"
