# LLM Profile: GPT-4o (OpenAI)
#
# Schema:  wf_types::llm::profile::LlmProfile
# Provider: LlmProvider::OPENAI_CHAT
#
# Provider enum values: OPENAI_CHAT | OPENAI_RESPONSE | ANTHROPIC | GEMINI_NATIVE | GEMINI_OPENAI | Custom(String)
#
# Generation params live under [generation] (typed, validated, mapped per
# provider). The legacy [parameters] table still works as a passthrough for
# provider-specific keys (e.g. logit_bias, logprobs).

id = "gpt-4o"
name = "GPT-4o"
provider = "OPENAI_CHAT"
model = "gpt-4o"
apiKey = "${OPENAI_API_KEY}"
baseUrl = "https://api.openai.com/v1"

# Authentication type for the HTTP client.
# Options: "native" (provider-specific), "bearer", "basic", "header", "custom"
authType = "native"

# Format to use for tool call serialization.
# Options: "json_wrapped" (default) | "json_unwrapped" | "json_schema" | "strict_json_schema" | "native"
[toolCallFormat]
format = "json_wrapped"

# Model's maximum input context window (tokens).
contextWindowSize = 128000

timeout = 30000
maxRetries = 2
retryDelay = 5000

[generation]
temperature = 0.5
max_tokens = 12800
# GPT-4o is not a reasoning model: omit [generation.thinking].
# Tool control (optional):
# tool_choice = { mode = "auto" }
# parallel_tool_calls = true

[streamOptions]
includeUsage = true

[metadata]
tags = ["openai", "gpt-4o", "fast", "cheap"]
