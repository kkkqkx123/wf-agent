[package]
name = "wf-llm"
version.workspace = true
edition.workspace = true

[features]
mock = []

[dependencies]
wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }
wf-metrics = { path = "../wf-metrics" }
wf-plugin-sdk = { path = "../../foundation/wf-plugin-sdk" }
# Shared tool-call protocol: partial-JSON recovery plus XML text-protocol
# parsing/rendering. wf-llm re-exports these modules so the agent engine
# layer stays on a single canonical implementation.
llm-tool-call = { package = "llm-suite-tool-call", path = "../llm-suite/crates/llm-suite-tool-call", features = ["json-partial", "xml"] }
# Shared token sizing and message transforms re-exported by this facade.
llm-token = { package = "llm-suite-token", path = "../llm-suite/crates/llm-suite-token" }
llm-message = { package = "llm-suite-message", path = "../llm-suite/crates/llm-suite-message" }
# Shared wire protocol layer re-exported by this facade.
llm-codec = { package = "llm-suite-codec", path = "../llm-suite/crates/llm-suite-codec" }
# Wire tool declaration named by the codec trait signature.
llm-types = { package = "llm-suite-types", path = "../llm-suite/crates/llm-suite-types" }
# Shared transport, configuration and gateway layers re-exported by this facade.
llm-client = { package = "llm-suite-client", path = "../llm-suite/crates/llm-suite-client", features = ["mock"] }
llm-config = { package = "llm-suite-config", path = "../llm-suite/crates/llm-suite-config" }
llm-gateway = { package = "llm-suite-gateway", path = "../llm-suite/crates/llm-suite-gateway", features = ["mock"] }
# Credential storage, OAuth login/refresh primitives and provider-owned
# authentication, re-exported by this facade. `file-store` gives hosts a
# ready JSON store (0600, atomic replace) for `wf llm login`.
llm-auth = { package = "llm-suite-auth", path = "../llm-suite/crates/llm-suite-auth", features = ["file-store"] }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
dashmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
bytes.workspace = true
regex.workspace = true

[dev-dependencies]
wf-llm = { path = ".", features = ["mock"] }
