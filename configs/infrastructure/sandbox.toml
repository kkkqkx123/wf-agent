# Sandbox Global Configuration
#
# Defines sandbox profiles and auto-matching rules for script sandboxing.
# Each profile specifies security policies, strategy priority, and VFS config.
#
# Processor: sandbox_global → validate_sandbox_global()

# Default sandbox mode for all scripts (overridden by profiles and execution-time config)
# "disabled" | "lenient" | "strict" | "custom"
mode = "lenient"

# Default profile when no rules match
default_profile = "default"

# Named sandbox profiles
[[profiles]]
name = "default"
description = "Default safe sandbox profile"
mode = "strict"

[profiles.shell]
denied_commands = ["sudo", "su", "chroot", "mount", "umount", "dd", "mkfs", "reboot", "shutdown", "passwd"]

[profiles.python]
denied_modules = ["os", "subprocess", "ctypes", "socket", "pty"]

[profiles.javascript]
denied_modules = ["child_process", "cluster", "worker_threads", "vm"]

[[profiles]]
name = "permissive"
description = "Permissive sandbox profile for trusted scripts"
mode = "lenient"

[profiles.shell]
denied_commands = ["sudo", "su", "chroot"]

# Profile selection rules (evaluated in order, first match wins)
[[rules]]
language = "shell"
risk_level = "high"
profile = "default"

[[rules]]
language = "python"
risk_level = "high"
profile = "default"

[[rules]]
language = "javascript"
risk_level = "high"
profile = "default"

[[rules]]
language = "lua"
risk_level = "high"
profile = "default"
