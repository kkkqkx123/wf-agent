[package]
name = "wf-tui"
version.workspace = true
edition.workspace = true
description = "wf-agent full TUI implementation (ratatui): interactive agent forms and widgets"

[dependencies]
clap.workspace = true
async-trait.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
futures.workspace = true
libc.workspace = true
regex.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
tokio-util.workspace = true
wf-common = { path = "../../foundation/wf-common" }
wf-types = { path = "../../foundation/wf-types" }
wf-core = { path = "../../foundation/wf-core" }
wf-api = { path = "../wf-api" }
wf-cli-shared = { path = "../wf-cli-shared" }

[dev-dependencies]
tempfile = "3"
insta = "1"
wf-llm = { path = "../../infra/wf-llm", features = ["mock"] }
wf-storage = { path = "../../infra/wf-storage" }
wf-resource = { path = "../../infra/wf-resource" }

[features]
default = ["embedded"]
embedded = ["wf-cli-shared/embedded"]
remote = ["reqwest/json", "reqwest/stream", "wf-cli-shared/remote"]
lua = ["wf-cli-shared/lua"]
native = ["wf-cli-shared/native"]
diff-record = []

[[bin]]
name = "wf"
path = "src/main.rs"
