[workspace]
resolver = "2"
members = [
    # foundation
    "crates/foundation/wf-types",
    "crates/foundation/wf-common",
    "crates/foundation/wf-core",
    # infra
    "crates/infra/wf-metrics",
    "crates/infra/wf-config",
    "crates/infra/wf-storage",
    "crates/infra/wf-llm",
    "crates/infra/wf-script",
    "crates/infra/wf-sandbox",
    "crates/infra/wf-shell",
    "crates/infra/wf-plugin",
    "crates/infra/wf-resource",
    # engine
    "crates/engine/wf-tools",
    "crates/engine/wf-execution-shared",
    "crates/engine/wf-agent",
    "crates/engine/wf-workflow",
    "crates/engine/wf-checkpoint",
    # app
    "crates/app/wf-api",
    "crates/app/wf-server",
    "crates/app/wf-runtime",
    "crates/app/wf-cli",
    # vendor
    "crates/vendor/layertwine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono"] }
dashmap = "6"
async-trait = "0.1"
blake3 = "1"
bincode = "1.3"
moka = { version = "0.12", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
once_cell = "1"
eventsource-stream = "0.2"
futures = "0.3"
tokio-util = "0.7"
rand = "0.8"
num_cpus = "1"
semver = "1"

# General-purpose utilities
parking_lot = "0.12"
zstd = "0.13"
smallvec = "1"
toml = "1.1"
hex = "0.4"
similar = "3"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }

# Pattern matching / glob
regex = "1"
globset = "0.4"

# File watching
notify = "8"

# Process / terminal
libc = "0.2"
portable-pty = "0.8"
crossterm = { version = "0.29", features = ["event-stream"] }

# TUI / text layout
ratatui = { version = "0.30", default-features = true }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.13"

# HTTP/gRPC transport
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit"] }
http = "1.1"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
