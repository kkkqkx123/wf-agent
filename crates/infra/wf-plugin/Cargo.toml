[package]
name = "wf-plugin"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "fs", "rt"] }
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
dashmap.workspace = true
chrono.workspace = true
semver.workspace = true
futures.workspace = true

wf-types = { path = "../../foundation/wf-types" }
wf-common = { path = "../../foundation/wf-common" }
wf-core = { path = "../../foundation/wf-core" }
wf-plugin-sdk = { path = "../../foundation/wf-plugin-sdk" }
wf-sandbox = { path = "../wf-sandbox", optional = true }

toml.workspace = true

ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
anyhow = "1"

mlua = { version = "0.9", optional = true, default-features = false, features = ["luajit", "send"] }
libloading = { version = "0.8", optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }

[dev-dependencies]
wat = { workspace = true }
wit-component = { workspace = true }
wit-parser = { workspace = true }
wasmparser = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
lua = ["dep:mlua", "wf-sandbox/lua"]
native = ["dep:libloading"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:blake3"]
